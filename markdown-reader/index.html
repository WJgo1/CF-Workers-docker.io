<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 阅读器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="libs/highlight-github.css" id="highlight-light">
    <link rel="stylesheet" href="libs/highlight-github-dark.css" id="highlight-dark" disabled>
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="toolbar-left">
            <button class="btn" id="btn-open-file" title="打开文件 (Ctrl+O)">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span>打开文件</span>
            </button>
            <button class="btn" id="btn-open-folder" title="打开文件夹">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
                <span>打开文件夹</span>
            </button>
            <div class="divider"></div>
            <button class="btn" id="btn-sidebar" title="侧边栏">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <button class="btn" id="btn-toc" title="目录">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9h14V7H3v2zm0 4h14v-2H3v2zm0 4h14v-2H3v2zm16 0h2v-2h-2v2zm0-10v2h2V7h-2zm0 6h2v-2h-2v2z"/></svg>
            </button>
        </div>
        <div class="toolbar-center">
            <span class="file-title" id="file-title">欢迎使用 Markdown 阅读器</span>
        </div>
        <div class="toolbar-right">
            <button class="btn" id="btn-search" title="搜索">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="btn" id="btn-theme" title="主题">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
            <button class="btn" id="btn-font-decrease" title="减小字体">A-</button>
            <button class="btn" id="btn-font-reset" title="重置字体">A</button>
            <button class="btn" id="btn-font-increase" title="增大字体">A+</button>
            <div class="divider"></div>
            <button class="btn" id="btn-export" title="导出HTML">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>导出</span>
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-container">
        <!-- 侧边栏 - 文件浏览器 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-input" id="file-search" placeholder="搜索文件...">
            </div>
            <div class="file-tree" id="file-tree">
                <div class="empty-hint">
                    <p>拖拽文件或文件夹到这里</p>
                    <p class="hint-text">点击工具栏按钮也可以打开</p>
                </div>
            </div>
        </aside>

        <!-- 预览区域 -->
        <section class="content-area" id="content-area">
            <div class="markdown-body" id="markdown-body">
                <div class="welcome-screen">
                    <h1>📖 Markdown 阅读器</h1>
                    <div class="welcome-content">
                        <h2>快速开始</h2>
                        <ul>
                            <li>点击顶部 <strong>"打开文件"</strong> 按钮选择单个 .md 文件</li>
                            <li>点击顶部 <strong>"打开文件夹"</strong> 按钮浏览整个目录</li>
                            <li><strong>拖拽</strong> 文件或文件夹到窗口中即可打开</li>
                        </ul>
                        <h2>快捷键</h2>
                        <ul>
                            <li><kbd>Ctrl</kbd> + <kbd>O</kbd> — 打开文件</li>
                            <li><kbd>Ctrl</kbd> + <kbd>+</kbd> — 放大字体</li>
                            <li><kbd>Ctrl</kbd> + <kbd>-</kbd> — 缩小字体</li>
                            <li><kbd>Ctrl</kbd> + <kbd>0</kbd> — 重置字体</li>
                            <li><kbd>Ctrl</kbd> + <kbd>B</kbd> — 切换侧边栏</li>
                            <li><kbd>Ctrl</kbd> + <kbd>T</kbd> — 切换主题</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右侧目录 -->
        <aside class="toc-panel" id="toc-panel">
            <div class="toc-header">
                <span>目录</span>
            </div>
            <nav class="toc-content" id="toc-content"></nav>
        </aside>
    </main>

    <!-- 底部状态栏 -->
    <footer class="statusbar">
        <span class="status-item" id="status-chars">0 字符</span>
        <span class="status-item" id="status-words">0 词</span>
        <span class="status-item" id="status-lines">0 行</span>
        <span class="status-item status-right" id="status-theme">主题：亮色</span>
    </footer>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt" hidden>
    <input type="file" id="folder-input" webkitdirectory directory multiple hidden>

    <!-- 搜索框 -->
    <div class="search-overlay" id="search-overlay" hidden>
        <div class="search-box">
            <input type="text" class="search-field" id="search-field" placeholder="在文档中搜索...">
            <button class="btn btn-small" id="search-prev" title="上一个">▲</button>
            <button class="btn btn-small" id="search-next" title="下一个">▼</button>
            <span class="search-count" id="search-count"></span>
            <button class="btn btn-small" id="search-close" title="关闭">✕</button>
        </div>
    </div>

    <script src="libs/marked.min.js"></script>
    <script src="libs/highlight.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
